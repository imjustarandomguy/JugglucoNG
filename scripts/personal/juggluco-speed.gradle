// Personal Gradle init script: faster local builds and tests (measured 2026-10-11).
// scripts/personal/test.sh passes it with --init-script; for a build, add
// `--init-script scripts/personal/juggluco-speed.gradle`. Copying it to ~/.gradle/init.d/
// would apply it to every Gradle build on the machine (the owner's call).
//
// 1. BUILD_TIME from the HEAD commit time instead of System.currentTimeMillis(): the
//    current time changed BuildConfig on every new configuration (new --tests filter,
//    -P value or worktree), which recompiled everything and kept the build cache from
//    ever hitting. Targeted test run 56 s -> ~12 s. The label comes out in UTC.
// 2. Kotlin -Xbackend-threads=0: cold compile about 21 % faster.
allprojects { p ->
    p.pluginManager.withPlugin('com.android.application') {
        def head = p.providers.exec {
            commandLine 'git', '-C', p.rootDir.absolutePath, 'log', '-1', '--format=%ct'
            ignoreExitValue = true
        }.standardOutput.asText
        p.afterEvaluate {
            def secs = head.getOrElse('').trim()
            def label = secs.isLong()
                ? new java.text.SimpleDateFormat('HH:mm:ss dd-MMM-yyyy').format(new Date(secs.toLong() * 1000L))
                : 'unknown'
            p.android.defaultConfig.buildConfigField('String', 'BUILD_TIME', "\"${label}\"")
        }
    }
    p.tasks.configureEach { t ->
        if (t.class.name.contains('KotlinCompile') && t.hasProperty('compilerOptions'))
            t.compilerOptions.freeCompilerArgs.add('-Xbackend-threads=0')
    }
}
